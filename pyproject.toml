[tool.poetry]
name = "clinic-scraper"
version = "0.1.0"
description = "ClinicScraper: Модульный асинхронный сервис сбора, краулинга и скоринга клиник (2GIS, Яндекс, Gemini)"
authors = ["aqwarius2003"]
license = "MIT"
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
httpx = {extras = ["http2"], version = "^0.27.0"}
pandas = "^2.2.0"
beautifulsoup4 = "^4.12.0"
diskcache = "^5.6.0"
pydantic = "^2.6.0"
openpyxl = "^3.1.0"
lxml = "^5.1.0"
google-generativeai = "^0.8.0"
python-dotenv = "^1.0.1"
playwright = "^1.42.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


